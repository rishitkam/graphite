[project]
name = "graphite"
version = "0.1.0"
description = "Agentic fraud investigation agent for the TigerGraph HHGOA hackathon"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pyTigerGraph>=1.6",
    "anthropic>=0.34",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
