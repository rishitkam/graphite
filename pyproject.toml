[project]
name = "graphite"
version = "0.1.0"
description = "Agentic fraud investigation agent for the TigerGraph HHGOA hackathon"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pyTigerGraph>=1.6",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
